<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Pedido de stock</title>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    color: #222;
    margin: 0;
    padding: 12px;
  }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  select, input[type="text"], input[type="number"] {
    font-size: 14px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 100%;
  }
  #ciudad-bloque { margin-bottom: 16px; }
  .fila {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 100px 32px;
    gap: 8px;
    align-items: start;
    margin-bottom: 6px;
  }
  .sugerencias {
    position: absolute;
    top: 100%;
    left: 0;
    right: 116px;
    background: #fff;
    border: 1px solid #ccc;
    border-top: none;
    border-radius: 0 0 6px 6px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 10;
  }
  .sugerencia { padding: 8px; cursor: pointer; }
  .sugerencia:hover { background: #f0f4ff; }
  .sugerencia .stock-bajo { color: #b45309; }
  .quitar {
    background: #fee2e2;
    border: 1px solid #fca5a5;
    border-radius: 6px;
    cursor: pointer;
    height: 36px;
  }
  .error { grid-column: 1 / span 3; color: #b91c1c; font-size: 12px; }
  #add-row {
    margin-top: 6px;
    padding: 8px 14px;
    border: 1px dashed #888;
    background: #fafafa;
    border-radius: 6px;
    cursor: pointer;
  }
  #aviso-ciudad { color: #6b7280; font-size: 13px; }
  #estado-carga { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>

  <div id="ciudad-bloque">
    <label for="ciudad">Almacén de origen</label>
    <select id="ciudad">
      <option value="">-- elige tu almacén --</option>
    </select>
  </div>

  <div id="estado-carga">Cargando catálogo…</div>
  <div id="aviso-ciudad" style="display:none;">Elige primero el almacén de origen para buscar productos.</div>

  <div id="filas"></div>
  <button type="button" id="add-row" style="display:none;">+ Añadir producto</button>
  <div id="total-pedido" style="display:none; margin-top:12px; font-weight:600; text-align:right;"></div>

<script>
// ============ CONFIGURACIÓN — EDITA ESTOS DOS VALORES ============
const SHEET_ID = "1wA6-oc77x_UjnN5FQ2Jwsxr84IUzRynwFFzS1vId0AQ";
const API_KEY = "AIzaSyCuUdozQVtXw30mqNuh2xsex989J8jZIV0";
// ===================================================================

let opciones = [];      // una entrada por lote, ya cruzada con producto y ciudad
let ciudades = [];
let filasState = [];    // [{id, seleccion:null|opcion, cantidad:number}]
let catalogoListo = false;

function filasAObjetos(values) {
  if (!values || values.length < 2) return [];
  const [cabeceras, ...filas] = values;
  return filas.map(f => Object.fromEntries(cabeceras.map((c, i) => [c, f[i]])));
}

async function obtenerHoja(nombre) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(nombre)}?key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`No se pudo cargar la hoja "${nombre}" (${res.status})`);
  const data = await res.json();
  return filasAObjetos(data.values);
}

async function cargarCatalogo() {
  const [productos, lotes, almacenes] = await Promise.all([
    obtenerHoja("Productos"),
    obtenerHoja("Lotes"),
    obtenerHoja("Almacenes"),
  ]);

  const mapaProductos = new Map(productos.map(p => [p.Linea + "|" + p.Codigo, p]));
  const mapaCiudad = new Map(almacenes.map(a => [a.Linea + "|" + a.Almacen, a.Ciudad]));

  opciones = lotes
    .map(l => {
      const prod = mapaProductos.get(l.Linea + "|" + l.Codigo);
      return {
        linea: l.Linea,
        codigo: l.Codigo,
        nombre: prod ? prod.Nombre : "(producto no encontrado)",
        precio: prod ? (parseFloat(prod.Precio) || 0) : 0,
        almacen: l.Almacen,
        lote: l.Lote,
        stock: parseFloat(l.Stock_Lote) || 0,
        caducidad: l.Caducidad || "",
        ciudad: mapaCiudad.get(l.Linea + "|" + l.Almacen) || "(sin ciudad)",
      };
    })
    .filter(o => o.stock > 0 && o.lote !== "REVISAR_LOTE");

  ciudades = [...new Set(almacenes.map(a => a.Ciudad))];
  const sel = document.getElementById("ciudad");
  ciudades.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });

  catalogoListo = true;
  document.getElementById("estado-carga").style.display = "none";
  actualizarVisibilidad();
  redimensionar();
}

function actualizarVisibilidad() {
  const ciudad = document.getElementById("ciudad").value;
  document.getElementById("aviso-ciudad").style.display = ciudad ? "none" : "block";
  document.getElementById("add-row").style.display = ciudad ? "inline-block" : "none";
  document.getElementById("filas").style.display = ciudad ? "block" : "none";
  redimensionar();
}

function redimensionar() {
  if (window.JFCustomWidget) {
    // margen extra para que no se corten los bordes ni la lista de sugerencias
    JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight + 20 });
  }
}

function textoOpcion(o) {
  const avisoStock = o.stock <= 5 ? ` ⚠ quedan ${o.stock}` : ` — ${o.stock} uds`;
  const cad = o.caducidad ? ` — cad. ${o.caducidad}` : "";
  const precio = ` — ${o.precio.toFixed(2)}€/ud`;
  return `${o.nombre} (${o.linea}) — Lote ${o.lote}${avisoStock}${precio}${cad}`;
}

function crearFila() {
  filasState.push({ id: "f" + Math.random().toString(36).slice(2), seleccion: null, cantidad: 0 });
  renderFilas();
}

function quitarFila(id) {
  filasState = filasState.filter(f => f.id !== id);
  renderFilas();
}

function renderFilas() {
  const cont = document.getElementById("filas");
  cont.innerHTML = "";
  filasState.forEach(fila => {
    const div = document.createElement("div");
    div.className = "fila";
    div.innerHTML = `
      <div style="position:relative;">
        <input type="text" class="buscar" data-id="${fila.id}" autocomplete="off"
               placeholder="Nombre o código del producto..."
               value="${fila.seleccion ? textoOpcion(fila.seleccion).replace(/"/g, "&quot;") : ""}">
        <div class="sugerencias" data-id="${fila.id}"></div>
      </div>
      <input type="number" class="cantidad" data-id="${fila.id}" min="1"
             placeholder="Cant." value="${fila.cantidad || ""}">
      <button type="button" class="quitar" data-id="${fila.id}" title="Quitar">✕</button>
      <div class="error" data-id="${fila.id}"></div>
      <div class="subtotal" data-id="${fila.id}" style="grid-column:1 / span 3; font-size:12px; color:#555;">
        ${fila.seleccion && fila.cantidad > 0 ? `Subtotal: ${(fila.seleccion.precio * fila.cantidad).toFixed(2)}€` : ""}
      </div>
    `;
    cont.appendChild(div);
  });
  if (filasState.length === 0) crearFila(); // siempre al menos una fila visible
  enganchar();
  enviarEstado();
  redimensionar();
}

function opcionesDeLaCiudad() {
  const ciudad = document.getElementById("ciudad").value;
  return opciones.filter(o => o.ciudad === ciudad);
}

function filtrar(texto) {
  const t = texto.trim().toLowerCase();
  if (t.length < 2) return [];
  return opcionesDeLaCiudad()
    .filter(o => o.nombre.toLowerCase().includes(t) || String(o.codigo).toLowerCase().includes(t))
    .slice(0, 8);
}

function enganchar() {
  document.querySelectorAll(".buscar").forEach(input => {
    input.oninput = () => {
      const id = input.dataset.id;
      const fila = filasState.find(f => f.id === id);
      fila.seleccion = null; // si edita el texto a mano, invalida la selección previa
      const cont = document.querySelector(`.sugerencias[data-id="${id}"]`);
      const sugs = filtrar(input.value);
      cont.innerHTML = "";
      sugs.forEach(o => {
        const d = document.createElement("div");
        d.className = "sugerencia";
        d.textContent = textoOpcion(o);
        d.onclick = () => {
          fila.seleccion = o;
          input.value = textoOpcion(o);
          cont.innerHTML = "";
          validarFila(id);
          actualizarSubtotal(id);
          enviarEstado();
          redimensionar();
        };
        cont.appendChild(d);
      });
      validarFila(id);
      enviarEstado();
      redimensionar();
    };
    input.onblur = () => {
      // pequeño delay para que el click en una sugerencia registre antes de cerrar la lista
      setTimeout(() => {
        const cont = document.querySelector(`.sugerencias[data-id="${input.dataset.id}"]`);
        if (cont) cont.innerHTML = "";
        redimensionar();
      }, 150);
    };
  });

  document.querySelectorAll(".cantidad").forEach(input => {
    input.oninput = () => {
      const fila = filasState.find(f => f.id === input.dataset.id);
      fila.cantidad = parseInt(input.value, 10) || 0;
      validarFila(input.dataset.id);
      actualizarSubtotal(input.dataset.id);
      enviarEstado();
      redimensionar();
    };
  });

  document.querySelectorAll(".quitar").forEach(btn => {
    btn.onclick = () => quitarFila(btn.dataset.id);
  });
}

function validarFila(id) {
  const fila = filasState.find(f => f.id === id);
  const errEl = document.querySelector(`.error[data-id="${id}"]`);
  if (!errEl) return;
  if (!fila.seleccion) {
    errEl.textContent = "";
    return;
  }
  if (fila.cantidad <= 0) {
    errEl.textContent = "Indica una cantidad";
  } else if (fila.cantidad > fila.seleccion.stock) {
    errEl.textContent = `Solo hay ${fila.seleccion.stock} unidades en ese lote`;
  } else {
    errEl.textContent = "";
  }
}

function actualizarSubtotal(id) {
  const fila = filasState.find(f => f.id === id);
  const subEl = document.querySelector(`.subtotal[data-id="${id}"]`);
  if (!subEl) return;
  subEl.textContent =
    fila.seleccion && fila.cantidad > 0
      ? `Subtotal: ${(fila.seleccion.precio * fila.cantidad).toFixed(2)}€`
      : "";
}

function formularioValido() {
  const ciudad = document.getElementById("ciudad").value;
  const filasConDatos = filasState.filter(f => f.seleccion || f.cantidad);
  if (!ciudad || filasConDatos.length === 0) return false;
  return filasConDatos.every(f => f.seleccion && f.cantidad > 0 && f.cantidad <= f.seleccion.stock);
}

function enviarEstado() {
  const ciudad = document.getElementById("ciudad").value;
  const filasConDatos = filasState.filter(f => f.seleccion && f.cantidad > 0);

  const total = filasConDatos.reduce((suma, f) => suma + f.seleccion.precio * f.cantidad, 0);
  const totalEl = document.getElementById("total-pedido");
  if (filasConDatos.length > 0) {
    totalEl.style.display = "block";
    totalEl.textContent = `Total del pedido: ${total.toFixed(2)}€`;
  } else {
    totalEl.style.display = "none";
  }

  const pedido = {
    ciudad,
    lineas: filasConDatos.map(f => ({
      linea: f.seleccion.linea,
      codigo: f.seleccion.codigo,
      nombre: f.seleccion.nombre,
      almacen: f.seleccion.almacen,
      lote: f.seleccion.lote,
      cantidad: f.cantidad,
      precio: f.seleccion.precio,
    })),
  };
  if (window.JFCustomWidget) {
    JFCustomWidget.sendData({ value: JSON.stringify(pedido), valid: formularioValido() });
  }
}

document.getElementById("ciudad").onchange = () => {
  filasState.forEach(f => (f.seleccion = null));
  actualizarVisibilidad();
  renderFilas();
};

document.getElementById("add-row").onclick = crearFila;

const dentroDeIframe = window.self !== window.top;

if (window.JFCustomWidget && dentroDeIframe) {
  JFCustomWidget.subscribe("ready", function () {
    cargarCatalogo().catch(err => {
      document.getElementById("estado-carga").textContent =
        "No se pudo cargar el catálogo: " + err.message;
    });
  });
  JFCustomWidget.subscribe("submit", enviarEstado);
} else {
  // permite abrir el archivo suelto en el navegador para probarlo fuera de JotForm
  cargarCatalogo().catch(err => {
    document.getElementById("estado-carga").textContent =
      "No se pudo cargar el catálogo: " + err.message;
  });
}
</script>
</body>
</html>
